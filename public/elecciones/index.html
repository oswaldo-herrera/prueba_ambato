<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elecciones Ambato 2027 · Javier Altamirano</title>
  <meta name="description" content="Envía tu comentario o propuesta para Ambato. Javier Altamirano te escucha." />
  <link rel="icon" href="/favicon.svg" />
  <link rel="manifest" href="/elecciones/manifest.json" />
  <script src="/elecciones/supabase.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --azul: #1A56DB;
      --oro: #FF6600;
      --azul-oscuro: #0E3FA5;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #EEF3FF;
      min-height: 100vh;
      color: #1a1a1a;
    }

    /* ── HEADER ── */
    .header {
      background: linear-gradient(135deg, var(--azul-oscuro) 0%, var(--azul) 100%);
      border-bottom: 4px solid var(--oro);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .header-titulo {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 1.1rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #fff;
    }
    .header-titulo span { color: var(--oro); }

    /* ── MAIN ── */
    .main {
      max-width: 680px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }

    .titulo-seccion {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 1.8rem;
      margin-bottom: 6px;
    }
    .titulo-seccion span { color: var(--oro); }
    .subtitulo {
      color: rgba(255,255,255,0.6);
      font-size: 0.9rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    /* ── CARD FORMULARIO ── */
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    .campo label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #6b7280;
      margin-bottom: 8px;
    }

    select, textarea {
      width: 100%;
      background: #f9fafb;
      border: 1.5px solid #d1d5db;
      border-radius: 12px;
      color: #111827;
      font-family: inherit;
      font-size: 0.95rem;
      padding: 12px 16px;
      outline: none;
      transition: border-color 0.2s;
      appearance: none;
      -webkit-appearance: none;
    }
    input[type="text"] {
      width: 100%;
      background: #f9fafb;
      border: 1.5px solid #d1d5db;
      border-radius: 12px;
      color: #111827;
      font-family: inherit;
      font-size: 0.95rem;
      padding: 12px 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: var(--azul); }
    select:focus, textarea:focus {
      border-color: var(--azul);
    }
    select option { background: #fff; color: #111827; }
    textarea { resize: vertical; min-height: 110px; }

    /* Select arrow */
    .select-wrap { position: relative; }
    .select-wrap::after {
      content: '▾';
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
      pointer-events: none;
      font-size: 1rem;
    }

    /* ── BOTONES FOTO / UBICACIÓN ── */
    .acciones {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .btn-accion {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: #f3f4f6;
      border: 1.5px solid #d1d5db;
      border-radius: 10px;
      color: #374151;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 10px 16px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      font-family: inherit;
    }
    .btn-accion:hover { background: #e5e7eb; border-color: var(--oro); }
    .btn-accion.activo { border-color: #22c55e; color: #16a34a; }
    .btn-accion.ubicacion-ok { border-color: #22c55e; color: #16a34a; }

    .fotos-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .foto-thumb {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 10px;
      border: 2px solid var(--oro);
    }

    /* ── BOTÓN ENVIAR ── */
    .btn-enviar {
      width: 100%;
      background: #25D366;
      color: #fff;
      font-family: inherit;
      font-weight: 800;
      font-size: 1rem;
      padding: 16px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.2s, transform 0.1s;
      letter-spacing: 0.03em;
    }
    .btn-enviar:hover { background: #1db954; transform: scale(1.01); }
    .btn-enviar:active { transform: scale(0.99); }

    .nota {
      font-size: 0.75rem;
      color: #9ca3af;
      text-align: center;
      margin-top: -8px;
    }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.72rem;
      color: #9ca3af;
    }

    /* ── TABS ── */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .tab {
      flex: 1;
      padding: 10px 16px;
      border-radius: 12px;
      border: 1.5px solid #d1d5db;
      background: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      color: #6b7280;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }
    .tab.activo {
      background: var(--azul);
      border-color: var(--azul);
      color: #fff;
      box-shadow: 0 4px 12px rgba(26,86,219,0.3);
    }
    .badge {
      background: var(--oro);
      color: #fff;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 1px 7px;
      min-width: 20px;
      text-align: center;
      display: none;
    }
    .badge.visible { display: inline-block; }

    /* ── AVISO OFFLINE ── */
    .aviso {
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-top: -8px;
      text-align: center;
      display: none;
    }
    .aviso.guardado { background: #dcfce7; color: #16a34a; display: block; }
    .aviso.error { background: #fee2e2; color: #dc2626; display: block; }

    /* ── TARJETA PENDIENTE ── */
    .pendiente-vacio {
      text-align: center;
      color: #9ca3af;
      font-size: 0.9rem;
      padding: 40px 20px;
    }
    .card-pendiente {
      background: #fff;
      border: 1.5px solid #e5e7eb;
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .card-pendiente .cp-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    .card-pendiente .cp-parroquia {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--azul-oscuro);
    }
    .card-pendiente .cp-fecha {
      font-size: 0.72rem;
      color: #9ca3af;
    }
    .card-pendiente .cp-obs {
      font-size: 0.82rem;
      color: #6b7280;
      margin-bottom: 10px;
      line-height: 1.5;
    }
    .card-pendiente .cp-fotos {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .card-pendiente .cp-fotos img {
      width: 54px;
      height: 54px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid #e5e7eb;
    }
    .card-pendiente .cp-acciones {
      display: flex;
      gap: 8px;
    }
    .btn-enviar-p {
      flex: 1;
      background: #25D366;
      color: #fff;
      font-family: inherit;
      font-weight: 800;
      font-size: 0.82rem;
      padding: 10px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-enviar-p:hover { background: #1db954; }
    .btn-enviar-p:disabled { background: #9ca3af; cursor: default; }
    .btn-eliminar-p {
      background: #f3f4f6;
      color: #6b7280;
      border: 1.5px solid #d1d5db;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.2s;
    }
    .btn-eliminar-p:hover { background: #fee2e2; border-color: #fca5a5; color: #dc2626; }
    .estado-enviado {
      font-size: 0.78rem;
      color: #16a34a;
      font-weight: 600;
      text-align: center;
      padding: 6px;
    }

    @media (max-width: 480px) {
      .titulo-seccion { font-size: 1.5rem; }
      .card { padding: 20px 16px; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <div class="header-titulo">Elecciones <span>2026</span></div>
  </div>

  <!-- MAIN -->
  <main class="main">

    <!-- TABS -->
    <div class="tabs">
      <button class="tab activo" id="tabFormulario" onclick="mostrarTab('formulario')">Formulario</button>
      <button class="tab" id="tabPendientes" onclick="mostrarTab('pendientes')">
        Pendientes <span class="badge" id="badge">0</span>
      </button>
    </div>

    <!-- SECCIÓN FORMULARIO -->
    <div id="seccionFormulario">
    <div class="card">

      <!-- NOMBRE -->
      <div class="campo">
        <label>Nombre *</label>
        <input type="text" id="nombre" placeholder="Tu nombre completo" autocomplete="name" />
      </div>

      <!-- PARROQUIA -->
      <div class="campo">
        <label>Parroquia *</label>
        <div class="select-wrap">
          <select id="parroquia">
            <option value="">— Selecciona tu parroquia —</option>
            <optgroup label="Urbanas">
              <option>Atocha - Ficoa</option>

            <optgroup label="Rurales">
              <option>Ambatillo</option>

      <!-- COMENTARIO -->
      <div class="campo">

      <!-- FOTOS -->
      <div class="campo">
        <label>Fotos (opcional)</label>
        <div class="acciones">
          <button class="btn-accion" onclick="document.getElementById('cameraInput').click()">
            📷 Tomar foto
          </button>
          <button class="btn-accion" onclick="document.getElementById('fileInput').click()">
            🖼️ Agregar foto

            📍 Usar mi ubicación
          </button>

        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" multiple onchange="agregarFotos(this)" />

        <p style="font-size:0.75rem;color:#9ca3af;margin-top:8px;">📌 Usa la <strong>cámara trasera</strong> del celular para tomar la foto.</p>
        <div class="fotos-preview" id="fotosPreview"></div>

      <!-- BOTÓN ENVIAR -->
      <button class="btn-enviar" onclick="enviarWhatsApp(); return false;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.374 0 0 5.373 0 12c0 2.117.549 4.107 1.504 5.836L.057 23.882a.75.75 0 0 0 .921.921l6.047-1.447A11.955 11.955 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.846 0-3.573-.484-5.075-1.332l-.363-.214-3.767.902.916-3.767-.221-.375A9.956 9.956 0 0 1 2 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/></svg>

    </div>
    </div><!-- /seccionFormulario -->

    <!-- SECCIÓN PENDIENTES -->
    <div id="seccionPendientes" style="display:none">
      <div id="listaPendientes"></div>
    </div>

  </main>

  <footer>
    © 2026 · javieraltamirano.org · Ambato 2027–2031
  </footer>

  <script>
    const SUPABASE_URL = 'https://innyjxzsskuyfbzjciwj.supabase.co'
    const SUPABASE_KEY = 'sb_publishable_5dAJzEx9ozaz-mCxeytJwA_tabkgzHf'
    const BUCKET = 'elecciones-fotos'
    let sb = null
    try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) } catch(e) {}

    let ubicacionTexto = ''
    let fotosSeleccionadas = []
    let fotosBase64 = []

    function agregarFotos(input) {
      const archivos = Array.from(input.files)
      archivos.forEach(archivo => {
        if (fotosSeleccionadas.length >= 3) return
        fotosSeleccionadas.push(archivo)
        const reader = new FileReader()
        reader.onload = e => {
          fotosBase64.push(e.target.result)
          const img = document.createElement('img')
          img.src = e.target.result
          img.className = 'foto-thumb'
          document.getElementById('fotosPreview').appendChild(img)
        }
        reader.readAsDataURL(archivo)
      })
      input.value = ''
    }

    function obtenerUbicacion() {
      const btn = document.getElementById('btnUbicacion')
      btn.textContent = '⏳ Obteniendo...'
      if (!navigator.geolocation) {
        alert('Tu dispositivo no soporta geolocalización.')
        btn.textContent = '📍 Usar mi ubicación'
        return
      }
      navigator.geolocation.getCurrentPosition(
        pos => {
          const lat = pos.coords.latitude.toFixed(6)
          const lng = pos.coords.longitude.toFixed(6)
          ubicacionTexto = `https://maps.google.com/?q=${lat},${lng}`
          btn.textContent = '✅ Ubicación obtenida'
          btn.classList.add('ubicacion-ok')
        },
        () => {
          alert('No se pudo obtener la ubicación. Verifica los permisos.')
          btn.textContent = '📍 Usar mi ubicación'
        }
      )
    }

    async function acortarUrl(url) {
      try {
        const res = await fetch(`https://is.gd/create.php?format=simple&url=${encodeURIComponent(url)}`)
        if (res.ok) {
          const corta = (await res.text()).trim()
          if (corta.startsWith('http')) return corta
        }
      } catch {}
      return url
    }

    async function subirFotos() {
      if (!sb) return []
      const urls = []
      for (const archivo of fotosSeleccionadas) {
        const ext = archivo.name.split('.').pop() || 'jpg'
        const nombre = `${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`
        try {
          const { error } = await sb.storage.from(BUCKET).upload(nombre, archivo, { cacheControl: '3600', upsert: false, contentType: archivo.type })
          if (!error) {
            const { data } = sb.storage.from(BUCKET).getPublicUrl(nombre)
            if (data?.publicUrl) urls.push(data.publicUrl)
          }
        } catch(e) {}
      }
      return urls
    }

    // ── TABS ──
    function mostrarTab(tab) {
      document.getElementById('seccionFormulario').style.display = tab === 'formulario' ? '' : 'none'
      document.getElementById('seccionPendientes').style.display = tab === 'pendientes' ? '' : 'none'
      document.getElementById('tabFormulario').classList.toggle('activo', tab === 'formulario')
      document.getElementById('tabPendientes').classList.toggle('activo', tab === 'pendientes')
      if (tab === 'pendientes') renderPendientes()
    }

    // ── LOCALSTORAGE ──
    function getPendientes() {
      try { return JSON.parse(localStorage.getItem('elecciones_pendientes') || '[]') } catch { return [] }
    }
    function setPendientes(lista) {
      try { localStorage.setItem('elecciones_pendientes', JSON.stringify(lista)) } catch {}
    }
    function actualizarBadge() {
      const total = getPendientes().filter(p => !p.enviado).length
      const badge = document.getElementById('badge')
      badge.textContent = total
      badge.classList.toggle('visible', total > 0)
    }

    function guardarPendiente(nombre, parroquia, comentario, ubicacion, fotos64) {
      const lista = getPendientes()
      const id = Date.now()
      const fecha = new Date().toLocaleString('es-EC', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' })
      lista.unshift({ id, nombre, parroquia, comentario, ubicacion, fotos64, fecha, enviado: false })
      setPendientes(lista)
      actualizarBadge()
      return id
    }

    // ── RENDER PENDIENTES ──
    function renderPendientes() {
      const lista = getPendientes()
      const cont = document.getElementById('listaPendientes')
      if (lista.length === 0) {
        cont.innerHTML = '<div class="pendiente-vacio">📭 No hay envíos guardados.</div>'
        return
      }
      cont.innerHTML = lista.map(p => `
        <div class="card-pendiente" id="cp-${p.id}">
          <div class="cp-header">
            <div class="cp-parroquia">${p.nombre ? p.nombre + ' · ' : ''}${p.parroquia}</div>
            <div class="cp-fecha">${p.fecha}</div>
          </div>
          ${p.comentario ? `<div class="cp-obs">${p.comentario}</div>` : ''}
          ${p.ubicacion ? `<div class="cp-obs" style="font-size:0.75rem">📍 Ubicación guardada</div>` : ''}
          ${p.fotos64 && p.fotos64.length > 0 ? `<div class="cp-fotos">${p.fotos64.map(f => `<img src="${f}">`).join('')}</div>` : ''}
          <div class="cp-acciones">
            ${p.enviado
              ? `<div class="estado-enviado" style="flex:1">✅ Enviado</div>`
              : `<button class="btn-enviar-p" id="btn-${p.id}" onclick="enviarPendiente(${p.id})">📤 Enviar por WhatsApp</button>`
            }
            <button class="btn-eliminar-p" onclick="eliminarPendiente(${p.id})">🗑</button>
          </div>
        </div>
      `).join('')
    }

    function eliminarPendiente(id) {
      setPendientes(getPendientes().filter(p => p.id !== id))
      actualizarBadge()
      renderPendientes()
    }

    async function enviarPendiente(id) {
      const btn = document.getElementById(`btn-${id}`)
      if (btn) { btn.textContent = '⏳ Subiendo...'; btn.disabled = true }

      const lista = getPendientes()
      const p = lista.find(x => x.id === id)
      if (!p) return

      let fotosUrls = []
      if (p.fotos64 && p.fotos64.length > 0 && sb) {
        for (const b64 of p.fotos64) {
          try {
            const blob = await (await fetch(b64)).blob()
            const ext = blob.type.split('/')[1] || 'jpg'
            const nombre = `${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`
            const { error } = await sb.storage.from(BUCKET).upload(nombre, blob, { cacheControl: '3600', upsert: false, contentType: blob.type })
            if (!error) {
              const { data } = sb.storage.from(BUCKET).getPublicUrl(nombre)
              if (data?.publicUrl) fotosUrls.push(await acortarUrl(data.publicUrl))
            }
          } catch {}
        }
      }

      let mensaje = '*ELECCIONES 2026 · Javier Altamirano*\n'
      if (p.nombre) mensaje += `*Nombre:* ${p.nombre}\n`
      mensaje += `*Parroquia:* ${p.parroquia}\n`
      if (p.comentario) mensaje += `*Observaciones:* ${p.comentario}\n`
      if (p.ubicacion) mensaje += `*Ubicación:* ${p.ubicacion}\n`
      fotosUrls.forEach((url, i) => { mensaje += `*Foto ${i + 1}:* ${url}\n` })
      mensaje += `_javieraltamirano.org/elecciones_`

      window.open(`https://wa.me/593986324840?text=${encodeURIComponent(mensaje)}`, '_blank')

      p.enviado = true
      setPendientes(lista)
      actualizarBadge()
      renderPendientes()
    }

    // ── ENVIAR FORMULARIO ──
    async function enviarWhatsApp() {
      const nombre = document.getElementById('nombre').value.trim()
      const parroquia = document.getElementById('parroquia').value
      const comentario = document.getElementById('comentario').value.trim()
      const aviso = document.getElementById('avisoEnvio')
      aviso.className = 'aviso'

      if (!nombre) { alert('Por favor ingresa tu nombre.'); return }
      if (!parroquia) { alert('Por favor selecciona tu parroquia.'); return }

      const btn = document.querySelector('.btn-enviar')
      btn.disabled = true

      // Siempre guardar como pendiente
      guardarPendiente(nombre, parroquia, comentario, ubicacionTexto, [...fotosBase64])

      if (!navigator.onLine) {
        btn.textContent = 'Enviar'
        btn.disabled = false
        aviso.className = 'aviso guardado'
        aviso.textContent = '📥 Sin internet — guardado en Pendientes. Se enviará cuando tengas señal.'
        // Reset form
        document.getElementById('nombre').value = ''
        document.getElementById('parroquia').value = ''
        document.getElementById('comentario').value = ''
        fotosSeleccionadas = []; fotosBase64 = []
        document.getElementById('fotosPreview').innerHTML = ''
        ubicacionTexto = ''
        const btnUb = document.getElementById('btnUbicacion')
        btnUb.textContent = '📍 Usar mi ubicación'; btnUb.classList.remove('ubicacion-ok')
        return
      }

      btn.textContent = '⏳ Subiendo fotos...'
      let fotosUrls = []
      if (fotosSeleccionadas.length > 0) fotosUrls = await subirFotos()

      let mensaje = '*ELECCIONES 2026 · Javier Altamirano*\n'
      mensaje += `*Nombre:* ${nombre}\n`
      mensaje += `*Parroquia:* ${parroquia}\n`
      if (comentario) mensaje += `*Observaciones:* ${comentario}\n`
      if (ubicacionTexto) mensaje += `*Ubicación:* ${ubicacionTexto}\n`
      for (let i = 0; i < fotosUrls.length; i++) {
        mensaje += `*Foto ${i + 1}:* ${await acortarUrl(fotosUrls[i])}\n`
      }
      mensaje += `_javieraltamirano.org/elecciones_`

      window.open(`https://wa.me/593986324840?text=${encodeURIComponent(mensaje)}`, '_blank')

      // Marcar como enviado
      const lista = getPendientes()
      const ultimo = lista[0]
      if (ultimo) { ultimo.enviado = true; setPendientes(lista) }
      actualizarBadge()

      btn.textContent = 'Enviar'
      btn.disabled = false

      // Reset form
      document.getElementById('nombre').value = ''
      document.getElementById('parroquia').value = ''
      document.getElementById('comentario').value = ''
      fotosSeleccionadas = []; fotosBase64 = []
      document.getElementById('fotosPreview').innerHTML = ''
      ubicacionTexto = ''
      const btnUb = document.getElementById('btnUbicacion')
      btnUb.textContent = '📍 Usar mi ubicación'; btnUb.classList.remove('ubicacion-ok')
    }

    // Init badge al cargar
    actualizarBadge()

    // Registrar Service Worker para funcionar offline
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/elecciones/sw.js').catch(() => {})
    }
  </script>
