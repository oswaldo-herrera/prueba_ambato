<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="ball" cx="38%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#3d4275"/>
      <stop offset="35%" stop-color="#21243D"/>
      <stop offset="75%" stop-color="#171929"/>
      <stop offset="100%" stop-color="#0a0b14"/>
    </radialGradient>
    <radialGradient id="spot" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </radialGradient>
    <radialGradient id="shine" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="white" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="edge" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <clipPath id="ballClip">
      <circle cx="256" cy="256" r="245"/>
    </clipPath>
  </defs>

  <!-- Ball -->
  <circle cx="256" cy="256" r="245" fill="url(#ball)"/>

  <!-- White number circle -->
  <circle cx="256" cy="256" r="108" fill="url(#spot)" clip-path="url(#ballClip)"/>

  <!-- Gold J letter -->
  <text
    x="260" y="270"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="132"
    font-weight="bold"
    font-style="italic"
    fill="#B8893F"
    text-anchor="middle"
    dominant-baseline="middle"
    filter="url(#glow)"
  >J</text>

  <!-- Shine highlight top-left -->
  <ellipse cx="188" cy="168" rx="72" ry="48" fill="url(#shine)" clip-path="url(#ballClip)"/>

  <!-- Edge darkening -->
  <circle cx="256" cy="256" r="245" fill="url(#edge)"/>

  <!-- Subtle bottom logo text -->
  <text
    x="256" y="358"
    font-family="Arial, sans-serif"
    font-size="16"
    font-weight="600"
    fill="#B8893F"
    text-anchor="middle"
    opacity="0.7"
    letter-spacing="1"
  >JAVIER ALTAMIRANO</text>
</svg>
