<style>

<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H, CX, CY;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
    CX = W / 2; CY = H * 0.50;
  }
  resize();
  window.addEventListener('resize', resize);

  const FOV  = 520;
  const BRAD = 28; // ball world-radius

  /* ── 3D → 2D projection (origin at CX,CY, +z = away from camera) ── */
  function proj(x, y, z) {
    const s = FOV / Math.max(FOV + z, 1);
    return { x: CX + x * s, y: CY + y * s, s };
  }

  /* ── Draw realistic sphere ── */
  function drawBall(sx, sy, r, red, alpha) {
    if (r < 0.5 || alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = alpha;

    // Shadow on table
    if (r > 4) {
      const sg = ctx.createRadialGradient(sx + r*.12, sy + r*.8, 0, sx, sy + r*.7, r * 1.35);
      sg.addColorStop(0, 'rgba(0,0,0,.5)');
      sg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = sg;
      ctx.beginPath();
      ctx.ellipse(sx + r*.1, sy + r*.75, r * 1.25, r * .28, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // Base sphere gradient
    const c0 = red ? '#ff5a5a' : '#ffffff';
    const c1 = red ? '#d10a0a' : '#e2e2e2';
    const c2 = red ? '#8a0000' : '#b0b0b0';
    const c3 = red ? '#3c0000' : '#707070';
    const g = ctx.createRadialGradient(sx - r*.33, sy - r*.33, r*.04, sx + r*.08, sy + r*.1, r);
    g.addColorStop(0, c0); g.addColorStop(.48, c1);
    g.addColorStop(.78, c2); g.addColorStop(1, c3);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.fill();

    // Primary specular
    const sp = ctx.createRadialGradient(sx - r*.4, sy - r*.42, 0, sx - r*.24, sy - r*.28, r*.52);
    sp.addColorStop(0, 'rgba(255,255,255,.95)');
    sp.addColorStop(.38, 'rgba(255,255,255,.35)');
    sp.addColorStop(.75, 'rgba(255,255,255,.06)');
    sp.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sp;
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.fill();

    // Soft secondary
    const sp2 = ctx.createRadialGradient(sx + r*.28, sy + r*.3, 0, sx + r*.18, sy + r*.22, r*.38);
    sp2.addColorStop(0, 'rgba(255,255,255,.16)');
    sp2.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sp2;
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.fill();

    // Rim darkening
    const rim = ctx.createRadialGradient(sx, sy, r * .68, sx, sy, r);
    rim.addColorStop(0, 'rgba(0,0,0,0)');
    rim.addColorStop(1, 'rgba(0,0,0,.38)');
    ctx.fillStyle = rim;
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.fill();

    ctx.restore();
  }

  /* ── Draw cue ── */
  function drawCue(tx, ty, bx, by, alpha) {
    if (alpha <= 0) return;
    const dx = bx - tx, dy = by - ty;
    const len = Math.hypot(dx, dy);
    if (len < 1) return;
    const nx = -dy / len, ny = dx / len;
    const tw = 3, bw = 11;

    ctx.save();
    ctx.globalAlpha = alpha;

    const woodG = ctx.createLinearGradient(tx, ty, bx, by);
    woodG.addColorStop(0,   '#D8C058');
    woodG.addColorStop(.22, '#B88828');
    woodG.addColorStop(.55, '#9A6818');
    woodG.addColorStop(.82, '#6A4010');
    woodG.addColorStop(1,   '#361E06');
    ctx.fillStyle = woodG;
    ctx.beginPath();
    ctx.moveTo(tx + nx*tw, ty + ny*tw);
    ctx.lineTo(bx + nx*bw, by + ny*bw);
    ctx.lineTo(bx - nx*bw, by - ny*bw);
    ctx.lineTo(tx - nx*tw, ty - ny*tw);
    ctx.closePath();
    ctx.fill();

    // Gloss highlight along length
    const hlG = ctx.createLinearGradient(tx + nx*tw*.5, ty + ny*tw*.5, tx - nx*tw*.5, ty - ny*tw*.5);
    hlG.addColorStop(0, 'rgba(255,230,120,.55)');
    hlG.addColorStop(.4, 'rgba(255,200,80,.15)');
    hlG.addColorStop(1, 'rgba(0,0,0,.3)');
    ctx.fillStyle = hlG;
    ctx.beginPath();
    ctx.moveTo(tx + nx*tw, ty + ny*tw);
    ctx.lineTo(bx + nx*bw, by + ny*bw);
    ctx.lineTo(bx - nx*bw, by - ny*bw);
    ctx.lineTo(tx - nx*tw, ty - ny*tw);
    ctx.closePath();
    ctx.fill();

    // Chalk tip
    ctx.fillStyle = '#7aabcc';
    ctx.beginPath(); ctx.ellipse(tx, ty, tw * 1.3, tw * 1.1, 0, 0, Math.PI * 2); ctx.fill();

    ctx.restore();
  }

  /* ── Impact flash ── */
  function drawImpact(sx, sy, t) {
    if (t <= 0 || t >= 1) return;
    ctx.save();
    ctx.globalAlpha = 1 - t;
    const r = t * 90;
    const ig = ctx.createRadialGradient(sx, sy, r*.2, sx, sy, r);
    ig.addColorStop(0, 'rgba(255,240,120,.85)');
    ig.addColorStop(.45, 'rgba(255,180,30,.4)');
    ig.addColorStop(1, 'rgba(255,80,0,0)');
    ctx.fillStyle = ig;
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI*2); ctx.fill();
    for (let i = 0; i < 14; i++) {
      const a = (i / 14) * Math.PI * 2;
      const d = t * 65;
      ctx.fillStyle = `rgba(255,${170 + (i%3)*30},60,${(1-t)*.9})`;
      ctx.beginPath();
      ctx.arc(sx + Math.cos(a)*d, sy + Math.sin(a)*d, 3*(1-t)+1, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  /* ── Draw table felt ── */
  function drawTable(alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;

    ctx.fillStyle = '#030609';
    ctx.fillRect(0, 0, W, H);

    // Felt trapezoid (perspective receding upward)
    const nearY = H + 20, farY = H * .36;
    const nearW = W * .98, farW = W * .14;
    ctx.beginPath();
    ctx.moveTo(CX - nearW/2, nearY); ctx.lineTo(CX + nearW/2, nearY);
    ctx.lineTo(CX + farW/2,  farY);  ctx.lineTo(CX - farW/2,  farY);
    ctx.closePath();
    const felt = ctx.createLinearGradient(CX, nearY, CX, farY);
    felt.addColorStop(0,   '#1e6030');
    felt.addColorStop(.45, '#145022');
    felt.addColorStop(1,   '#0a2e14');
    ctx.fillStyle = felt; ctx.fill();

    // Perspective grid lines
    ctx.strokeStyle = 'rgba(0,0,0,.1)'; ctx.lineWidth = 1;
    for (let i = 0; i <= 10; i++) {
      const t = i / 10;
      ctx.beginPath();
      ctx.moveTo(CX - nearW/2 + nearW*t, nearY);
      ctx.lineTo(CX - farW/2  + farW*t,  farY);
      ctx.stroke();
    }
    // Horizontal lines (perspective spacing)
    for (let j = 1; j <= 6; j++) {
      const t = Math.pow(j/7, 1.5);
      const y = nearY + (farY - nearY) * t;
      const lw = nearW + (farW - nearW) * t;
      ctx.beginPath(); ctx.moveTo(CX - lw/2, y); ctx.lineTo(CX + lw/2, y); ctx.stroke();
    }

    // Overhead light
    const light = ctx.createRadialGradient(CX, H*.65, 0, CX, H*.65, W*.58);
    light.addColorStop(0,   'rgba(90,220,110,.16)');
    light.addColorStop(.5,  'rgba(40,140,60,.06)');
    light.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = light; ctx.fillRect(0, 0, W, H);

    // Vignette
    const vig = ctx.createRadialGradient(CX, H*.5, H*.15, CX, H*.5, H*.85);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,.75)');
    ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H);

    ctx.restore();
  }

  /* ══════════════ ANIMATION STATE ══════════════ */

  // 3D world positions. z=0 is "camera near", +z is away.
  // White ball starts CLOSE (z=100), reds are FAR (z=400+).
  const WB_START_Z  = 100;
  const WB_END_Z    = 360; // white ball travels toward reds
  const RB_START_Z  = 400;
  const RB2_DZ      = 46;  // triangle back offset

  let wb = { x:0, y:0, z: WB_START_Z };

  // Red balls initial world positions (triangle)
  const RB_INIT = [
    { x:  0,  y:0, z: RB_START_Z          },  // front
    { x:-30,  y:0, z: RB_START_Z + RB2_DZ },  // back-left
    { x: 30,  y:0, z: RB_START_Z + RB2_DZ },  // back-right
  ];
  let rb = RB_INIT.map(b => ({ ...b, vx:0, vz:0 }));

  // Timing (ms)
  const T = {
    TABLE:    400,   // table fades in
    CUE_IN:   700,   // cue slides in
    AIM:      1100,  // cue held, aimed
    STRIKE:   1450,  // cue thrusts
    WB_ROLL:  1680,  // white ball starts moving
    COLLIDE:  2050,  // impact!
    SCENE_END: 3500, // fade out
    SHOW_INV: 3800,
  };

  let started = false, t0 = 0;
  let impactAge = -1, impactStartT = 0;
  let scattered = false;
  let running = true;

  /* ── Easing ── */
  const easeOut = t => 1 - Math.pow(1-t, 3);
  const easeIn  = t => t * t;
  const clamp   = (v,a,b) => Math.min(b, Math.max(a, v));
  const lerp    = (a,b,t) => a + (b-a)*t;
  const norm    = (v,a,b) => clamp((v-a)/(b-a), 0, 1);

  /* ── Main loop ── */
  function loop(now) {
    if (!started) { started = true; t0 = now; }
    const el = now - t0;

    ctx.clearRect(0, 0, W, H);

    // Table
    const tableAlpha = easeOut(norm(el, 0, T.TABLE));
    drawTable(tableAlpha);

    // ── White ball position ──
    if (el >= T.WB_ROLL && el < T.COLLIDE) {
      const t = easeIn(norm(el, T.WB_ROLL, T.COLLIDE));
      wb.z = lerp(WB_START_Z, WB_END_Z, t);
    }

    // ── Collision ──
    if (el >= T.COLLIDE && !scattered) {
      scattered = true;
      impactStartT = now;
      impactAge = 0;
      // Launch red balls toward camera and to sides
      rb[0].vx =   0;   rb[0].vz = -820; // straight at camera
      rb[1].vx = -290;  rb[1].vz = -640; // left-forward
      rb[2].vx =  290;  rb[2].vz = -640; // right-forward
    }

    if (scattered) {
      const dt = (now - impactStartT) / 1000;
      rb.forEach((b, i) => {
        b.x = RB_INIT[i].x + b.vx * dt;
        b.z = RB_INIT[i].z + b.vz * dt;
      });
      if (impactAge >= 0) impactAge = norm(now - impactStartT, 0, 700);
    }

    // ── Project balls ──
    const wbP = proj(wb.x, wb.y, wb.z);
    const rbP = rb.map(b => ({ ...proj(b.x, b.y, b.z), b }));

    // Draw red balls back-to-front (largest z = farthest = draw first)
    [...rbP].sort((a,b) => b.b.z - a.b.z).forEach(({ x, y, s, b }) => {
      const r = BRAD * Math.max(s, 0.001);
      const fadeAlpha = b.z < -300 ? Math.max(0, 1 - norm(b.z, -300, -520)) : tableAlpha;
      drawBall(x, y, r, true, fadeAlpha);
    });

    // Draw white ball (hide after collision)
    if (el < T.COLLIDE + 150) {
      const wa = el >= T.COLLIDE ? Math.max(0, 1 - norm(el, T.COLLIDE, T.COLLIDE+150)) : tableAlpha;
      drawBall(wbP.x, wbP.y, BRAD * wbP.s, false, wa);
    }

    // Impact
    if (impactAge > 0) {
      const rbFrontP = proj(RB_INIT[0].x, 0, RB_INIT[0].z);
      drawImpact(rbFrontP.x, rbFrontP.y, impactAge);
    }

    // ── Cue ──
    if (el >= T.CUE_IN && el < T.WB_ROLL + 100) {
      // Cue tip rests just above white ball, butt extends downward (toward viewer)
      const cueAlpha = el < T.CUE_IN   ? 0
        : el < T.AIM                    ? easeOut(norm(el, T.CUE_IN, T.AIM))
        : el < T.WB_ROLL                ? 1
        : Math.max(0, 1 - norm(el, T.WB_ROLL, T.WB_ROLL+100));

      // During strike: cue tip thrusts toward white ball (move toward contact)
      let strikeAdv = 0;
      if (el >= T.STRIKE && el < T.WB_ROLL) {
        strikeAdv = easeOut(norm(el, T.STRIKE, T.WB_ROLL)) * 52;
      }

      // Cue enter: slides up from below
      const enterOffset = el < T.AIM ? (1 - easeOut(norm(el, T.CUE_IN, T.AIM))) * 80 : 0;

      // Cue tip is just behind white ball (slightly below it on screen since that's "closer")
      const tipX = wbP.x + 4;
      const tipY = wbP.y + BRAD * wbP.s * 1.1 + 8 - strikeAdv + enterOffset;
      // Butt extends downward (toward viewer = lower on screen)
      const cueLen = Math.min(W, H) * 0.55;
      const angle  = -0.06; // nearly straight up-down, slight slant
      const buttX  = tipX + Math.sin(angle) * cueLen;
      const buttY  = tipY + Math.cos(angle) * cueLen;

      drawCue(tipX, tipY, buttX, buttY, cueAlpha);
    }

    // ── Scene fade in / out ──
    if (el < 200) {
      ctx.fillStyle = `rgba(3,6,9,${1 - el/200})`;
      ctx.fillRect(0, 0, W, H);
    }
    if (el > T.SCENE_END) {
      const ft = norm(el, T.SCENE_END, T.SHOW_INV);
      ctx.fillStyle = `rgba(33,36,61,${easeOut(ft)})`; // fade to --azul color
      ctx.fillRect(0, 0, W, H);
    }

    if (el > T.SHOW_INV) {
      running = false;
      showInv();
      return;
    }

    if (running) requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
})();

function showInv() {
  document.getElementById('skip').style.display = 'none';
  document.getElementById('inv').classList.add('show');
  const c = document.getElementById('c');
  setTimeout(() => { c.style.display = 'none'; }, 1100);
}

setTimeout(showInv, 4200);
</script>
