<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reportes — Javier Altamirano</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --azul:    #21243D;
      --azul-lt: #2e3256;
      --oro:     #AC7C3F;
      --oro-lt:  #D4A86A;
      --bg:      #f0f2f5;
      --card-bg: #ffffff;
      --text:    #1a1a2e;
      --muted:   #6b7280;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 16px 80px;
    }

    /* ── HEADER ── */
    header {
      background: var(--azul);
      color: #fff;
      width: 100%;
      max-width: 1100px;
      border-radius: 18px;
      padding: 28px 32px 22px;
      text-align: center;
      margin-bottom: 32px;
      box-shadow: 0 4px 28px rgba(33,36,61,0.20);
    }
    header img {
      width: 50px; height: 50px;
      object-fit: contain;
      display: block; margin: 0 auto 10px;
    }
    header h1 { font-size: 22px; font-weight: 800; letter-spacing: .02em; }
    header p  { font-size: 12px; color: var(--oro-lt); margin-top: 4px; letter-spacing: .08em; }

    /* ── SECCIÓN LABEL ── */
    .section-label {
      width: 100%; max-width: 1100px;
      font-size: 11px; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
      padding-left: 2px;
      display: flex; align-items: center; gap: 10px;
    }
    .section-label::after {
      content: '';
      flex: 1; height: 1px;
      background: #e5e7eb;
    }

    /* ── GRID DE REPORTES ── */
    .grid {
      width: 100%; max-width: 1100px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-bottom: 36px;
    }
    @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 500px) { .grid { grid-template-columns: 1fr; } }

    /* ── REPORT CARD ── */
    .rcard {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 22px 20px 20px;
      box-shadow: 0 2px 14px rgba(0,0,0,.08);
      display: flex; flex-direction: column; gap: 14px;
      border-top: 4px solid var(--oro);
      position: relative;
      overflow: hidden;
    }
    .rcard::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, rgba(172,124,63,.04) 0%, transparent 60%);
      pointer-events: none;
    }

    /* color top personalizable */
    .rcard[data-color="azul"]  { border-top-color: var(--azul); }
    .rcard[data-color="oro"]   { border-top-color: var(--oro); }
    .rcard[data-color="verde"] { border-top-color: #16a34a; }
    .rcard[data-color="morado"]{ border-top-color: #7c3aed; }
    .rcard[data-color="rojo"]  { border-top-color: #dc2626; }
    .rcard[data-color="celeste"]{ border-top-color: #0891b2; }

    .rcard-icon {
      width: 40px; height: 40px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      background: #f8f9fa;
      flex-shrink: 0;
    }

    .rcard-header {
      display: flex; align-items: center; gap: 12px;
    }

    .rcard-titulo { font-size: 14px; font-weight: 800; color: var(--azul); line-height: 1.2; }
    .rcard-subtitulo { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .rcard-stats {
      display: flex; gap: 10px;
    }
    .stat-mini {
      flex: 1;
      background: #f8f9fa;
      border-radius: 10px;
      padding: 10px 12px;
      text-align: center;
    }
    .stat-mini-num { font-size: 26px; font-weight: 900; color: var(--azul); line-height: 1; }
    .stat-mini-lbl { font-size: 9px; color: var(--muted); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-top: 2px; }

    .rcard-status {
      font-size: 11px; color: var(--muted);
      text-align: center; min-height: 14px;
    }

    .btn-dl {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 12px 16px;
      background: linear-gradient(135deg, var(--azul) 0%, var(--azul-lt) 100%);
      color: #fff; border: none; border-radius: 12px;
      font-size: 13px; font-weight: 800;
      cursor: pointer; letter-spacing: .03em;
      box-shadow: 0 3px 12px rgba(33,36,61,0.20);
      transition: opacity .2s, transform .1s;
    }
    .btn-dl:hover   { opacity: .88; }
    .btn-dl:active  { transform: scale(.97); }
    .btn-dl:disabled{ opacity: .45; cursor: not-allowed; }
    .xl-ico {
      width: 20px; height: 20px;
      background: #1d6f42; border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 900; color: #fff; flex-shrink: 0;
    }

    footer {
      margin-top: 16px;
      font-size: 11px; color: #bbb; text-align: center;
    }
  </style>
</head>
<body>

<header>
  <img src="/tierra/logo_j.svg" alt="Javier" onerror="this.style.display='none'" />
  <h1>Centro de Reportes</h1>
  <p>JAVIER ALTAMIRANO · CAMPAÑA ALCALDÍA AMBATO 2026</p>
</header>

<div class="section-label">Reportes disponibles</div>

<div class="grid" id="grid">
  <!-- Las cards se insertan por JS para facilitar agregar más -->
</div>

<footer>javieraltamirano.org · Campaña Alcaldía Ambato 2026</footer>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>
  const SB_URL = 'https://innyjxzsskuyfbzjciwj.supabase.co'
  const SB_KEY = 'sb_publishable_5dAJzEx9ozaz-mCxeytJwA_tabkgzHf'

  /* ─────────────────────────────────────────────────────────────
   *  DEFINICIÓN DE REPORTES
   *  Para agregar uno nuevo: copiar un objeto y ajustar sus campos.
   * ──────────────────────────────────────────────────────────── */
  const REPORTES = [
    {
      id:       'region5',
      titulo:   'Javier en Tu Casa',
      subtitulo:'Región 5 · Todas las parroquias',
      tabla:    'region_5',
      icono:    '🏘️',
      color:    'azul',
      hoy:      true,          // mostrar stat "Hoy"
      columnas: r => ({
        'Numero':            '___i___',
        'Nombre':            r.nombre    || '',
        'WhatsApp':          r.whatsapp  || '',
        'Parroquia':         r.parroquia || '',
        'Javier te escucha': r.necesidad || '',
        'Creado en':         r.creado_en ? new Date(r.creado_en).toLocaleString('es-EC') : '',
      }),
      anchos: [8, 30, 16, 28, 50, 22],
      hoja:  'Región 5',
      archivo: i => `javier_en_tu_casa_region5_${fecha()}.xlsx`,
    },
    {
      id:       'candidatos',
      titulo:   'Candidatos',
      subtitulo:'Directorio · Candidatos y coordinadores',
      tabla:    'candidatos',
      icono:    '⭐',
      color:    'oro',
      hoy:      false,
      columnas: r => ({
        'Numero':    '___i___',
        'Nombre':    r.nombre    || '',
        'Cargo':     r.cargo     || '',
        'Parroquia': r.parroquia || '',
        'Celular':   r.celular   || '',
        'Creado en': r.creado_en ? new Date(r.creado_en).toLocaleString('es-EC') : '',
      }),
      anchos: [8, 34, 30, 26, 18, 22],
      hoja:  'Candidatos',
      archivo: i => `candidatos_altamirano_${fecha()}.xlsx`,
    },
    /* ── PRÓXIMOS REPORTES ─ descomentar y personalizar ──────────
    {
      id:       'region1',
      titulo:   'Región 1',
      subtitulo:'Rural · Cunchibamba, Izamba, etc.',
      tabla:    'region_1',
      icono:    '🌿',
      color:    'verde',
      hoy:      true,
      columnas: r => ({
        'Numero':    '___i___',
        'Nombre':    r.nombre    || '',
        'WhatsApp':  r.whatsapp  || '',
        'Parroquia': r.parroquia || '',
        'Creado en': r.creado_en ? new Date(r.creado_en).toLocaleString('es-EC') : '',
      }),
      anchos: [8, 30, 16, 28, 22],
      hoja:  'Región 1',
      archivo: i => `region1_${fecha()}.xlsx`,
    },
    ── */
  ]

  /* ─────────────────────────────────────────────────────────────
   *  UTILIDADES
   * ──────────────────────────────────────────────────────────── */
  function fecha() { return new Date().toISOString().slice(0, 10) }

  function headers() {
    return { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}` }
  }

  /* ─────────────────────────────────────────────────────────────
   *  RENDER INICIAL
   * ──────────────────────────────────────────────────────────── */
  function init() {
    const grid = document.getElementById('grid')
    grid.innerHTML = REPORTES.map(r => cardHTML(r)).join('')
    REPORTES.forEach(r => cargar(r))
  }

  function cardHTML(r) {
    return `
      <div class="rcard" data-color="${r.color}" id="card-${r.id}">
        <div class="rcard-header">
          <div class="rcard-icon">${r.icono}</div>
          <div>
            <div class="rcard-titulo">${r.titulo}</div>
            <div class="rcard-subtitulo">${r.subtitulo}</div>
          </div>
        </div>
        <div class="rcard-stats" id="stats-${r.id}">
          <div class="stat-mini">
            <div class="stat-mini-num" id="total-${r.id}">—</div>
            <div class="stat-mini-lbl">Total</div>
          </div>
          ${r.hoy ? `<div class="stat-mini">
            <div class="stat-mini-num" id="hoy-${r.id}">—</div>
            <div class="stat-mini-lbl">Hoy</div>
          </div>` : ''}
        </div>
        <div class="rcard-status" id="status-${r.id}">Cargando...</div>
        <button class="btn-dl" id="btn-${r.id}" onclick="descargar('${r.id}')" disabled>
          <span class="xl-ico">XL</span>
          Descargar Excel
        </button>
      </div>`
  }

  /* ─────────────────────────────────────────────────────────────
   *  CARGA DE DATOS
   * ──────────────────────────────────────────────────────────── */
  const datos = {}

  async function cargar(r) {
    try {
      const res = await fetch(
        `${SB_URL}/rest/v1/${r.tabla}?select=*&order=id.asc&limit=10000`,
        { headers: headers() }
      )
      const lista = await res.json()
      datos[r.id] = lista

      document.getElementById(`total-${r.id}`).textContent = lista.length

      if (r.hoy) {
        const hoy = new Date().toDateString()
        const n = lista.filter(x => new Date(x.creado_en).toDateString() === hoy).length
        document.getElementById(`hoy-${r.id}`).textContent = n
      }

      document.getElementById(`status-${r.id}`).textContent = `${lista.length} registros listos`
      document.getElementById(`btn-${r.id}`).disabled = false
    } catch {
      document.getElementById(`status-${r.id}`).textContent = 'Error al cargar'
    }
  }

  /* ─────────────────────────────────────────────────────────────
   *  DESCARGA EXCEL
   * ──────────────────────────────────────────────────────────── */
  function descargar(id) {
    const r    = REPORTES.find(x => x.id === id)
    const lista = datos[id] || []
    if (!lista.length) return

    const btn = document.getElementById(`btn-${id}`)
    btn.disabled = true
    btn.innerHTML = '<span class="xl-ico">XL</span> Generando...'

    const filas = lista.map((row, i) => {
      const obj = r.columnas(row)
      // reemplazar marcador de posición con número secuencial
      Object.keys(obj).forEach(k => { if (obj[k] === '___i___') obj[k] = i + 1 })
      return obj
    })

    const ws = XLSX.utils.json_to_sheet(filas)
    ws['!cols'] = r.anchos.map(w => ({ wch: w }))

    const wb = XLSX.utils.book_new()
    XLSX.utils.book_append_sheet(wb, ws, r.hoja)
    XLSX.writeFile(wb, r.archivo(id))

    btn.disabled = false
    btn.innerHTML = '<span class="xl-ico">XL</span> Descargar Excel'
  }

  init()
</script>

</body>
</html>
